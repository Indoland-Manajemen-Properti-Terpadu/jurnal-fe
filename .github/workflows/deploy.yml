name: Build & Deploy Frontend

on:
  push:
    branches:
      - main-frontend
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: indoland-manajemen-properti-terpadu/jurnal-fe

jobs:
  # Enforces the promotion order that branch protection cannot express:
  # develop-frontend -> staging -> main-frontend, hotfix/* into either, and the
  # main-frontend -> staging hotfix back-merge. Logic and tests: scripts/lib/deployGuard.mjs.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require a merged PR from an allowed source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployGuard.mjs "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.repository }}"

  build-and-deploy:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref_name }}" == "main-frontend" ]]; then
            echo "TAG=production" >> $GITHUB_ENV
            echo "COMPOSE_SERVICES=frontend" >> $GITHUB_ENV
            echo "VITE_API_BASE_URL=https://jurnal-api.proapps.id" >> $GITHUB_ENV
          else
            echo "TAG=staging" >> $GITHUB_ENV
            echo "COMPOSE_SERVICES=frontend-staging" >> $GITHUB_ENV
            echo "VITE_API_BASE_URL=https://dev-jurnal-api.proapps.id" >> $GITHUB_ENV
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Deploys are manual for now: the backend team pulls the `production` image (or a
      # commit-SHA tag, for rollback) from ghcr.io on the server, which is moving. The runner
      # cannot reach port 22 (i/o timeout), so this step must not fail the run. When the new
      # server is ready, remove `continue-on-error` (or replace the step with a self-hosted runner).
      - name: Deploy to server via SSH
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/jurnal
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull ${{ env.COMPOSE_SERVICES }}
            docker compose up -d ${{ env.COMPOSE_SERVICES }}
            docker image prune -f
            echo "✅ Frontend (${{ env.TAG }}) deployed successfully!"
