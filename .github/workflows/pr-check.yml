name: Quality Gate & Build Check

on:
  pull_request:
    branches: ['develop-frontend', 'staging', 'main-frontend']

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (for Yarn 4)
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Typecheck
        run: yarn typecheck

      - name: Run Linting (ESLint ratchet & Stylelint)
        run: npm run lint

      # Promotion PRs (develop-frontend to staging, staging to main-frontend) are diffed against a
      # much older base, so "changed files" would be the whole history. Their content was already
      # checked when it was a feature PR.
      - name: Check Formatting (changed files only)
        if: ${{ github.head_ref != 'develop-frontend' && github.head_ref != 'staging' }}
        run: node scripts/prettierChanged.mjs "origin/${{ github.base_ref }}"

      - name: Run Unit Tests (Vitest)
        run: yarn vitest --run

      - name: Build Production Preview
        run: yarn build
