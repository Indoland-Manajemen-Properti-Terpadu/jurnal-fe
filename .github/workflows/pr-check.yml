name: Quality Gate & Build Check

on:
  pull_request:
    branches: ['develop-frontend', 'staging', 'main-frontend']

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (for Yarn 4)
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Typecheck
        run: yarn typecheck

      - name: Run Linting (ESLint ratchet & Stylelint)
        run: npm run lint

      - name: Check Formatting (changed files only)
        run: node scripts/prettierChanged.mjs "origin/${{ github.base_ref }}"

      - name: Run Unit Tests (Vitest)
        run: yarn vitest --run

      - name: Build Production Preview
        run: yarn build
